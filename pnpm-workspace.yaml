packages:
  - apps/*
  - packages/*

# Squirrel installer support pulled in by electron-builder; we package with NSIS.
ignoredBuiltDependencies:
  - electron-winstaller

# pnpm 10 blocks dependency install scripts unless listed here.
# electron downloads its binary in postinstall; esbuild fetches its platform binary.
onlyBuiltDependencies:
  - electron
  - esbuild
patchedDependencies:
  react-native-web@0.21.3: patches/react-native-web@0.21.3.patch
