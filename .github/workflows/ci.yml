# CI (AL-008, design §5, Decision D17). Every pull request, every ticket branch and every push to main
# runs typecheck, lint (ESLint + Steiger FSD), the lint probes, unit tests, the build and the Electron
# e2e suite. Any failure, including a Steiger finding or a layer-rule violation, fails the run.
name: CI

on:
  pull_request:
  push:
    # Ticket branches merge into main without a PR (TICKETS.md §7), so they are checked on push.
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  # A newer push supersedes a branch or PR run still in progress; every push to main is kept.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Verify and e2e (Windows)
    # The app ships for Windows, and Electron needs a desktop session: GitHub's Windows runners have
    # one, so no xvfb.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm's version comes from packageManager in package.json; the store is cached by lockfile hash.
      - name: Set up pnpm and its store cache
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 44 fetches its binary on demand, not at install, so fetch it here from a cache keyed
      # on the Electron version (@electron/get's default cache folder on Windows).
      - name: Read the Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Electron download
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}

      - name: Install the Electron binary
        run: node node_modules/electron/install.js

      # Typecheck, Lint, Unit tests and Build are `pnpm verify`, split so a failure names its check.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint + Steiger FSD)
        run: pnpm lint

      - name: Lint probes (rule violations still fail lint)
        run: pnpm lint:probes

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E (Playwright + Electron)
        run: pnpm e2e

      # The smoke screenshot on every run; traces and failure screenshots when a test fails.
      - name: Upload e2e results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
